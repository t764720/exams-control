<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة اختبارات وأنشطة المهارات الرقمية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4">

  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <header class="relative bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200 mb-8 overflow-hidden text-center md:text-right flex flex-col md:flex-row items-center justify-between gap-6">
      <div class="absolute top-0 right-0 left-0 h-1.5 bg-gradient-to-r from-emerald-500 via-teal-500 to-indigo-600"></div>
      
      <div>
        <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-full mb-2 border border-indigo-100">
          <span>📚</span>
          <span>منصة الأنشطة والاختبارات البرمجية</span>
        </span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800">بوابة اختبارات المهارات الرقمية</h1>
        <p class="text-sm text-slate-500 mt-1">اختر النشاط أو الاختبار المطلوب للبدء الفوري، أو انسخ الرابط المباشر للطلاب.</p>
      </div>

      <div class="flex items-center gap-3">
        <a href="admin.html" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-bold rounded-xl transition flex items-center gap-1.5 shadow-sm">
          <span>⚙️</span>
          <span>لوحة تحكم المعلم</span>
        </a>
      </div>
    </header>

    <!-- Search / Filter Bar -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="relative w-full md:w-80">
        <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">🔍</span>
        <input type="text" id="searchInput" oninput="applyFilterAndSort()" placeholder="ابحث عن اختبار أو مسمى مادة..." class="w-full pr-9 pl-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>

      <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
        <div class="flex items-center gap-2">
          <label for="sortSelect" class="text-xs font-bold text-slate-500 whitespace-nowrap">الترتيب:</label>
          <select id="sortSelect" onchange="applyFilterAndSort()" class="bg-slate-50 border border-slate-300 text-slate-700 text-xs font-semibold rounded-xl px-3 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none cursor-pointer">
            <option value="newest" selected>🕒 الأحدث أولاً (افتراضي)</option>
            <option value="oldest">🕰️ الأقدم أولاً</option>
            <option value="alpha">🔤 أبجدياً (أ - ي)</option>
            <option value="grade">🎓 حسب المرحلة الدراسية</option>
          </select>
        </div>

        <div class="text-xs text-slate-500 font-semibold" id="countDisplay">
          جاري تحميل الاختبارات...
        </div>
      </div>
    </div>

    <!-- Quizzes Grid -->
    <div id="quizzesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- يتم إدراج بطاقات الاختبارات هنا تلقائياً -->
    </div>

  </div>

  <!-- Toast Notification -->
  <div id="copyToast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-2.5 rounded-full text-xs font-bold shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50">
    تم نسخ الرابط بنجاح! 📋
  </div>

  <script>
    // قائمة تفاصيل الاختبارات المعروفة (عناوين وأوصاف مخصصة)
    const KNOWN_METADATA = {
      "operators.html": {
        title: "نشاط: المعاملات في بايثون",
        grade: "مادة المهارات الرقمية",
        desc: "تطبيق عملي لاختبار وفهم المعاملات الحسابية والمنطقية في بايثون.",
        duration: 15,
        icon: "➕"
      },
      "loops_quiz.html": {
        title: "اختبار عملي: حلقات التكرار (Loops)",
        grade: "ثاني متوسط - مادة المهارات الرقمية",
        desc: "اختبار عملي لكتابة حلقات التكرار for و while مع فحص وتصحيح الكود برمجياً.",
        duration: 15,
        icon: "🔁"
      },
      "input-quiz.html": {
        title: "نشاط : إدخال البيانات (input)",
        grade: "أول متوسط - مادة المهارات الرقمية",
        desc: "نشاط تفاعلي لاستقبال المدخلات وحساب العمليات البرمجية بلغة بايثون.",
        duration: 15,
        icon: "⌨️"
      },
      "nested_loops.html": {
        title: "نشاط : الحلقات المتداخلة (Nested Loops)",
        grade: "ثاني متوسط - مادة المهارات الرقمية",
        desc: "تطبيق عملي لمحاكاة الساعة الرقمية والجداول باستخدام الحلقات المتداخلة.",
        duration: 15,
        icon: "⏰"
      },
      "nested_lists.html": {
        title: "نشاط عملي: القوائم المتداخلة",
        grade: "ثالث متوسط - مادة المهارات الرقمية",
        desc: "التعامل مع المصفوفات والقوائم ثنائية الأبعاد واستخراج البيانات منها.",
        duration: 15,
        icon: "📑"
      },
      "variables_quiz.html": {
        title: "نشاط عملي: المتغيرات والأنواع",
        grade: "أول متوسط - مادة المهارات الرقمية",
        desc: "تعريف المتغيرات النصية والعددية وتطبيق العمليات الحسابية الأساسية.",
        duration: 15,
        icon: "📦"
      },
      "python-intro.html": {
        title: "نشاط : مقدمة في البرمجة بلغة بايثون",
        grade: "أول متوسط - مادة المهارات الرقمية",
        desc: "الأساسيات والمفاهيم الأولية لجمل الطباعة والمتغيرات البسيطة.",
        duration: 15,
        icon: "🐍"
      }
    };

    let allQuizzes = Object.keys(KNOWN_METADATA).map(fileName => ({
      file: `forms/${fileName}`,
      ...KNOWN_METADATA[fileName]
    }));

    // جلب القائمة الحقيقية المباشرة من مجلد forms على GitHub
    // بحيث إذا تم حذف أو إضافة أي اختبار يتم تحديث البوابة بدقة متطابقة
    async function loadQuizzesFromGitHub() {
      try {
        const repoOwner = "t764720";
        const repoName = "exams-control";
        const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/forms?t=${Date.now()}`);
        
        if (res.ok) {
          const remoteFiles = await res.json();
          const activeHtmlFiles = remoteFiles.filter(item => item.type === 'file' && item.name.endsWith('.html'));

          const syncedList = activeHtmlFiles.map((item, index) => {
            const fileName = item.name;
            const meta = KNOWN_METADATA[fileName] || {};
            const cleanTitle = meta.title || decodeURIComponent(fileName.replace(/\.html$/i, '')).replace(/[-_]/g, ' ');

            return {
              file: `forms/${fileName}`,
              fileName: fileName,
              title: cleanTitle,
              grade: meta.grade || "مادة المهارات الرقمية",
              desc: meta.desc || "اختبار متاح للطلاب عبر بوابة الاختبارات.",
              duration: meta.duration || 15,
              icon: meta.icon || "📝",
              orderIndex: index // لحفظ ترتيب الاكتشاف
            };
          });

          allQuizzes = syncedList;

          // محاولة جلب أحدث تاريخ تعديل لكل ملف في الخلفية لدقة الفرز الزمني
          fetchFileCommitDates(syncedList);

          applyFilterAndSort();
        }
      } catch (e) {
        console.log("Could not auto-fetch from GitHub API:", e);
      }
    }

    // جلب تواريخ الالتزامات (Commits) للملفات لفرز زمني دقيق دون التأثير على سرعة التحميل
    async function fetchFileCommitDates(list) {
      try {
        const repoOwner = "t764720";
        const repoName = "exams-control";
        
        // جلب آخر 30 كوميت للمجلد
        const commitsRes = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/commits?path=forms&per_page=30`);
        if (!commitsRes.ok) return;
        const commits = await commitsRes.json();

        // مطابقة الكوميتات
        // إذا كان هناك ملف مضاف حديثاً أو تم توليده، يمكننا أيضاً فحص كل ملف على حدة إذا لزم
        list.forEach(async (q) => {
          try {
            const fRes = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/commits?path=${q.file}&per_page=1`);
            if (fRes.ok) {
              const fCommits = await fRes.json();
              if (fCommits && fCommits.length > 0 && fCommits[0].commit && fCommits[0].commit.committer) {
                q.date = new Date(fCommits[0].commit.committer.date).getTime();
                // إعادة تطبيق الترتيب إذا كان المستخدم يختار الأحدث
                const currentSort = document.getElementById('sortSelect')?.value;
                if (currentSort === 'newest' || currentSort === 'oldest') {
                  applyFilterAndSort();
                }
              }
            }
          } catch (err) {}
        });
      } catch (e) {
        console.log("Date fetch non-critical error:", e);
      }
    }

    function applyFilterAndSort() {
      const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      const sortMode = document.getElementById('sortSelect')?.value || 'newest';

      let list = allQuizzes.filter(q => 
        q.title.toLowerCase().includes(query) || 
        q.grade.toLowerCase().includes(query) || 
        q.desc.toLowerCase().includes(query)
      );

      // تطبيق الترتيب المختار
      list.sort((a, b) => {
        if (sortMode === 'newest') {
          // إذا توفر تاريخ الكوميت نستخدمه
          if (a.date && b.date) return b.date - a.date;
          if (a.date) return -1;
          if (b.date) return 1;
          // كبديل افتراضي: ترتيب عكسي لظهور الملفات أو حسب المعرف
          return (b.orderIndex ?? 0) - (a.orderIndex ?? 0);
        } else if (sortMode === 'oldest') {
          if (a.date && b.date) return a.date - b.date;
          if (a.date) return 1;
          if (b.date) return -1;
          return (a.orderIndex ?? 0) - (b.orderIndex ?? 0);
        } else if (sortMode === 'alpha') {
          return a.title.localeCompare(b.title, 'ar');
        } else if (sortMode === 'grade') {
          const gradeCompare = a.grade.localeCompare(b.grade, 'ar');
          if (gradeCompare !== 0) return gradeCompare;
          return a.title.localeCompare(b.title, 'ar');
        }
        return 0;
      });

      renderQuizzes(list);
    }

    function renderQuizzes(list) {
      const grid = document.getElementById('quizzesGrid');
      grid.innerHTML = '';
      document.getElementById('countDisplay').innerText = `إجمالي الاختبارات: ${list.length}`;

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-400">
            <span class="text-4xl block mb-2">🔍</span>
            <p class="font-bold">لا توجد اختبارات تطابق بحثك</p>
          </div>
        `;
        return;
      }

      list.forEach(q => {
        const fullUrl = new URL(q.file, window.location.href).href;
        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition flex flex-col justify-between";

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="text-2xl p-2 bg-slate-50 border border-slate-100 rounded-xl">${q.icon}</span>
              <span class="text-[11px] font-bold px-2.5 py-1 bg-emerald-50 text-emerald-800 rounded-lg border border-emerald-100">
                ${q.duration ? `⏱️ ${q.duration} دقيقة` : 'بدون مؤقت'}
              </span>
            </div>

            <span class="text-xs font-bold text-indigo-600 block mb-1">${q.grade}</span>
            <h2 class="text-base font-bold text-slate-800 mb-2 leading-snug">${q.title}</h2>
            <p class="text-xs text-slate-500 leading-relaxed mb-4">${q.desc}</p>
          </div>

          <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
            <a href="${q.file}" target="_blank" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl text-center transition flex items-center justify-center gap-1">
              <span>بدء الاختبار</span> ↗
            </a>
            <button onclick="copyQuizLink('${fullUrl}')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition flex items-center gap-1" title="نسخ رابط الاختبار للطلاب">
              <span>📋</span> نسخ
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function copyQuizLink(url) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(showToast);
      } else {
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast();
      }
    }

    function showToast() {
      const toast = document.getElementById('copyToast');
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    // التهيئة المبدئية والتحميل التلقائي
    applyFilterAndSort();
    loadQuizzesFromGitHub();
  </script>
</body>
</html>
