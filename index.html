<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">اختبار المهارات الرقمية</title>
  <!-- Tailwind CSS للواجهة وتنسيق RTL -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- مكتبة Pyodide لتشغيل بايثون مباشرة في المتصفح -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  
  <style>
    body { font-family: 'Cairo', sans-serif; }
    textarea { 
      font-family: 'Consolas', 'Courier New', monospace; 
      direction: ltr; 
      text-align: left;
      -webkit-touch-callout: none !important;
    }
    #toastMessage {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 9999;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }
    #toastMessage.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <div class="max-w-3xl mx-auto px-4 mt-8">
    <!-- Header -->
    <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6 text-center">
      <span id="gradeBadgeDisplay" class="inline-block px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-semibold rounded-full mb-2">ثاني متوسط - مادة المهارات الرقمية</span>
      <h1 id="quizTitleDisplay" class="text-2xl font-bold text-slate-800">اختبار عملي: حلقات التكرار (Loops)</h1>
      <p id="quizDescDisplay" class="text-sm text-slate-500 mt-1">اكتب المقطع البرمجي المطلوب لكل سؤال واضغط على "اختبار الكود" للتحقق من المخرجات قبل الإرسال.</p>
    </header>

    <!-- Student Info -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">اسم الطالب الرباعي:</label>
          <input type="text" id="studentName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="أدخل اسمك هنا">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">الصف / الفصل:</label>
          <input type="text" id="studentClass" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="مثال: ثاني / 1">
        </div>
      </div>
    </div>

    <!-- Questions Container (Dynamic) -->
    <div id="quizQuestionsContainer" class="space-y-6">
      <!-- يتم توليد الأسئلة هنا تلقائياً حسب الإعدادات -->
    </div>

    <!-- Submit Section -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center mt-6">
      <button id="submitBtn" onclick="submitAssessment()" class="w-full md:w-1/2 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all shadow-md hover:shadow-lg">
        إرسال الإجابات ورصد النتيجة
      </button>
      <div id="submitStatus" class="mt-3 text-sm font-semibold hidden"></div>
    </div>

    <!-- Link to Admin (Optional for teacher) -->
    <div class="text-center mt-6">
      <a href="admin.html" class="text-xs text-slate-400 hover:text-slate-600 underline">⚙️ لوحة تحكم المعلم وإعدادات الأسئلة</a>
    </div>
  </div>

  <script>
    // جلب الإعدادات من ملف config.js أو localStorage
    const QUIZ_CONFIG = getQuizConfig();
    const SCRIPT_URL = QUIZ_CONFIG.scriptUrl;

    let pyodide = null;
    let quizResults = {}; // تخزين صحة حل كل سؤال بحسب id
    let totalPossibleScore = 0;

    // تهيئة واجهة الاختبار من الإعدادات
    function renderQuizUI() {
      document.title = QUIZ_CONFIG.quizTitle;
      document.getElementById('gradeBadgeDisplay').innerText = QUIZ_CONFIG.gradeBadge;
      document.getElementById('quizTitleDisplay').innerText = QUIZ_CONFIG.quizTitle;
      document.getElementById('quizDescDisplay').innerText = QUIZ_CONFIG.quizDesc;

      const container = document.getElementById('quizQuestionsContainer');
      container.innerHTML = '';
      totalPossibleScore = 0;

      QUIZ_CONFIG.questions.forEach((q, index) => {
        quizResults[q.id] = false;
        totalPossibleScore += (Number(q.score) || 1);

        const card = document.createElement('div');
        card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-100";
        card.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-bold text-slate-800">${q.title}</h2>
            <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md font-semibold">${q.score} ${q.score > 2 ? 'درجات' : (q.score === 2 ? 'درجتان' : 'درجة واحدة')}</span>
          </div>
          <p class="text-sm text-slate-600 mb-3 leading-relaxed">
            ${q.description}
          </p>

          <label class="block text-xs font-semibold text-slate-500 mb-1">محرر بايثون:</label>
          <textarea id="editor_${q.id}" rows="6" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full p-3 bg-slate-900 text-emerald-400 rounded-lg text-sm border-0 focus:ring-2 focus:ring-emerald-500" placeholder="${q.placeholder || '# اكتب الكود هنا'}"></textarea>

          <div class="flex items-center justify-between mt-3">
            <button onclick="testPythonCode('${q.id}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition-colors">
              ▶ تشغيل واختبار الكود
            </button>
            <span id="badge_${q.id}" class="text-xs px-2 py-1 rounded hidden font-semibold"></span>
          </div>

          <div id="outBox_${q.id}" class="mt-3 p-3 bg-slate-100 rounded-lg text-xs font-mono hidden text-left dir-ltr">
            <span class="text-slate-400 block mb-1 font-sans">المخرجات (Console Output):</span>
            <pre id="output_${q.id}" class="text-slate-800 whitespace-pre-wrap"></pre>
          </div>
        `;
        container.appendChild(card);
      });

      // إعادة تطبيق حماية مكافحة الغش والحافظة على المربعات المولدة حديثاً
      setupAntiCheat();
    }

    // تحميل بيئة Pyodide في الخلفية
    async function initPyodide() {
      try {
        pyodide = await loadPyodide();
        console.log("Python engine loaded successfully.");
      } catch (err) {
        console.error("Failed to load Pyodide", err);
      }
    }
    initPyodide();

    // دالة اختبار الكود المحلي
    async function testPythonCode(qId) {
      if (!pyodide) {
        alert("محرك بايثون قيد التحميل حالياً، يرجى الانتظار بضع ثوانٍ...");
        return;
      }

      const q = QUIZ_CONFIG.questions.find(item => item.id === qId);
      if (!q) return;

      const codeInput = document.getElementById(`editor_${qId}`).value;
      const outBox = document.getElementById(`outBox_${qId}`);
      const outElem = document.getElementById(`output_${qId}`);
      const badge = document.getElementById(`badge_${qId}`);

      outBox.classList.remove('hidden');
      badge.classList.remove('hidden');

      if (!codeInput.trim()) {
        outElem.innerText = "تنبيه: المحرر فارغ.";
        badge.className = "text-xs px-2 py-1 rounded bg-amber-100 text-amber-800";
        badge.innerText = "لم يتم إدخال كود";
        quizResults[qId] = false;
        return;
      }

      // التحقق من الكلمة الإلزامية إن وجدت
      if (q.requiredKeyword && q.requiredKeyword.trim()) {
        const keyword = q.requiredKeyword.trim().toLowerCase();
        if (!codeInput.toLowerCase().includes(keyword)) {
          outElem.innerText = `تنبيه: يجب استخدام الكلمة المفتاحية (${keyword}) في هذا السؤال.`;
          badge.className = "text-xs px-2 py-1 rounded bg-red-100 text-red-700";
          badge.innerText = `الكلمة (${keyword}) مفقودة`;
          quizResults[qId] = false;
          return;
        }
      }

      // تحويل مخرجات print إلى نص داخل جافاسكربت
      try {
        await pyodide.runPythonAsync(`
import sys
import io
sys.stdout = io.StringIO()
        `);

        // تشغيل كود الطالب
        await pyodide.runPythonAsync(codeInput);

        const stdout = await pyodide.runPythonAsync("sys.stdout.getvalue()");
        outElem.innerText = stdout.trim() || "[الكود تم تنفيذه بنجاح لكن دون أي مخرجات مطبوعة]";

        // التحقق من المخرجات المتوقعة
        let isCorrect = true;
        if (q.expectedOutput && q.expectedOutput.trim()) {
          const actualTokens = stdout.trim().split(/\s+/).filter(Boolean);
          const expectedTokens = q.expectedOutput.trim().split(/\s+/).filter(Boolean);

          if (actualTokens.length !== expectedTokens.length) {
            isCorrect = false;
          } else {
            for (let i = 0; i < actualTokens.length; i++) {
              if (actualTokens[i] !== expectedTokens[i]) {
                isCorrect = false;
                break;
              }
            }
          }
        }

        if (isCorrect) {
          badge.className = "text-xs px-2 py-1 rounded bg-emerald-100 text-emerald-800";
          badge.innerText = "المخرجات صحيحة تماماً ✔";
          quizResults[qId] = true;
        } else {
          badge.className = "text-xs px-2 py-1 rounded bg-amber-100 text-amber-800";
          badge.innerText = "المخرجات لا تطابق المطلوب ✖";
          quizResults[qId] = false;
        }

      } catch (err) {
        outElem.innerText = "Syntax / Runtime Error:\n" + err.message;
        badge.className = "text-xs px-2 py-1 rounded bg-red-100 text-red-700";
        badge.innerText = "خطأ في الكود ✖";
        quizResults[qId] = false;
      }
    }

    // إرسال البيانات إلى Google Sheets
    async function submitAssessment() {
      const name = document.getElementById('studentName').value.trim();
      const sClass = document.getElementById('studentClass').value.trim();
      const status = document.getElementById('submitStatus');
      const btn = document.getElementById('submitBtn');

      if (!name || !sClass) {
        alert("يرجى كتابة الاسم والفصل قبل إرسال الاختبار.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "جاري الإرسال...";
      status.classList.remove('hidden');
      status.className = "mt-3 text-sm font-semibold text-blue-600";
      status.innerText = "يتم الآن إرسال بياناتك إلى المعلم...";

      let totalEarnedScore = 0;
      const payload = {
        studentName: name,
        studentClass: sClass,
        timestamp: new Date().toISOString()
      };

      // جمع إجابات كل الأسئلة
      QUIZ_CONFIG.questions.forEach((q, index) => {
        const code = (document.getElementById(`editor_${q.id}`) || {}).value || '';
        const isValid = !!quizResults[q.id];
        const num = index + 1;

        payload[`q_${num}_code`] = code;
        payload[`q_${num}_valid`] = isValid;
        payload[`q_${num}_title`] = q.title;

        // دعم للتوافقية القديمة في حال كان السكربت السابق يستقبل forCode و whileCode
        if (index === 0) {
          payload.forCode = code;
          payload.forSuccess = isValid;
        } else if (index === 1) {
          payload.whileCode = code;
          payload.whileSuccess = isValid;
        }

        if (isValid) {
          totalEarnedScore += (Number(q.score) || 1);
        }
      });

      payload.totalScore = totalEarnedScore;
      payload.totalPossible = totalPossibleScore;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        status.className = "mt-3 text-sm font-semibold text-emerald-600";
        status.innerText = `تم إرسال الاختبار بنجاح! درجتك التقديرية: ${totalEarnedScore} من ${totalPossibleScore}`;
        btn.innerText = "تم الإرسال";
      } catch (e) {
        status.className = "mt-3 text-sm font-semibold text-red-600";
        status.innerText = "حدث خطأ أثناء الإرسال. يرجى مراجعة المعلم.";
        btn.disabled = false;
        btn.innerText = "إعادة المحاولة";
      }
    }

// =========================================================================
// 🚫 نظام منع النسخ واللصق والغش
// =========================================================================

function showToast(message, type = 'warning') {
  let toast = document.getElementById('toastMessage');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toastMessage';
    document.body.appendChild(toast);
  }
  toast.innerText = message;
  toast.className = type === 'warning' ? 'bg-amber-600 show' : 'bg-red-600 show';
  
  clearTimeout(window._toastTimeout);
  window._toastTimeout = setTimeout(() => {
    toast.className = toast.className.replace('show', '').trim();
  }, 2500);
}

function setupAntiCheat() {
  document.querySelectorAll('textarea').forEach(el => {
    let previousValue = el.value;
    
    ['keydown', 'focus', 'click', 'touchstart'].forEach(evt => {
      el.addEventListener(evt, () => {
        previousValue = el.value;
      });
    });

    el.addEventListener('beforeinput', function(e) {
      if (e.inputType === 'insertFromPaste' || e.inputType === 'insertReplacementText' || e.inputType === 'insertFromDrop') {
        e.preventDefault();
        showToast('تم حظر اللصق من الحافظة!', 'warning');
        return false;
      }
    });

    el.addEventListener('input', function(e) {
      if (e.inputType === 'insertFromPaste' || e.inputType === 'insertReplacementText') {
        this.value = previousValue;
        showToast('تم حظر اللصق من الحافظة!', 'warning');
        return;
      }
      
      const currentVal = this.value;
      const addedChars = currentVal.length - previousValue.length;
      if (addedChars > 3 && (!e.inputType || e.inputType === 'insertText')) {
        this.value = previousValue;
        showToast('تم حظر إدراج النص المنسوخ من شريط الحافظة!', 'warning');
        return;
      }
      
      previousValue = this.value;
    });
  });
}

// 1. منع القائمة المنسدلة للزر الأيمن للماوس (Right Click)
document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    showToast("تم تعطيل النقر بزر الفأرة الأيمن للحفاظ على نزاهة الاختبار", "warning");
});

// 2. منع أحداث النسخ واللصق والقص عبر الماوس أو القوائم
['copy', 'paste', 'cut'].forEach(eventType => {
    document.addEventListener(eventType, function (e) {
        e.preventDefault();
        const actionName = eventType === 'copy' ? 'النسخ' : eventType === 'paste' ? 'اللصق' : 'القص';
        showToast(`عملية ${actionName} معطلة داخل الاختبار!`, "warning");
    });
});

// 3. منع اختصارات لوحة المفاتيح الشهيرة للنسخ واللصق وفحص الصفحة
document.addEventListener('keydown', function (e) {
    const isCtrlOrMeta = e.ctrlKey || e.metaKey;
    const key = e.key.toLowerCase();

    if (isCtrlOrMeta && ['c', 'v', 'x', 'u', 's'].includes(key)) {
        e.preventDefault();
        showToast("الاختصارات معطلة داخل منصة الاختبار!", "warning");
        return false;
    }

    if (
        e.key === 'F12' || 
        (isCtrlOrMeta && e.shiftKey && ['i', 'j', 'c'].includes(key))
    ) {
        e.preventDefault();
        showToast("أدوات المطور معطلة أثناء الاختبار!", "warning");
        return false;
    }
});

// تشغيل بناء الواجهة عند تحميل الصفحة
renderQuizUI();
  </script>
</body>
</html>
