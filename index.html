<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">اختبار المهارات الرقمية</title>
  <!-- Tailwind CSS للواجهة وتنسيق RTL -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- مكتبة Pyodide لتشغيل بايثون مباشرة في المتصفح -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  
  <style>
    body { font-family: 'Cairo', sans-serif; }
    textarea { 
      font-family: 'Consolas', 'Courier New', monospace; 
      direction: ltr; 
      text-align: left;
      -webkit-touch-callout: none !important;
    }
    #toastMessage {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 9999;
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }
    #toastMessage.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <div class="max-w-3xl mx-auto px-4 mt-8">
    <!-- Header -->
    <header class="relative bg-white p-6 sm:p-8 rounded-2xl shadow-md border border-slate-200/80 mb-6 text-center overflow-hidden">
      <!-- شريط علوي جمالي متدرج -->
      <div class="absolute top-0 right-0 left-0 h-1.5 bg-gradient-to-r from-emerald-500 via-teal-500 to-indigo-500"></div>

      <span id="gradeBadgeDisplay" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-emerald-50 text-emerald-800 text-xs sm:text-sm font-bold rounded-full mb-3 border border-emerald-200 shadow-sm">
        <span>🏷️</span>
        <span>ثاني متوسط - مادة المهارات الرقمية</span>
      </span>

      <h1 id="quizTitleDisplay" class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight leading-snug">اختبار عملي: حلقات التكرار (Loops)</h1>

      <p id="quizDescDisplay" class="text-sm sm:text-base text-slate-600 mt-2 max-w-xl mx-auto leading-relaxed">اكتب المقطع البرمجي المطلوب لكل سؤال واضغط على "اختبار الكود" للتحقق من المخرجات قبل الإرسال.</p>

      <!-- Timer Box -->
      <div id="timerContainer" class="hidden mt-4 inline-flex items-center gap-2 px-4 py-2 bg-slate-900 text-white rounded-xl shadow-inner font-mono text-base sm:text-lg border border-slate-700">
        <span class="text-lg">⏳</span>
        <span class="font-sans text-xs text-slate-300 font-semibold">الوقت المتبقي:</span>
        <span id="timerDisplay" class="font-bold text-emerald-400 tracking-widest">00:00</span>
      </div>
    </header>

    <!-- Student Info -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">اسم الطالب الثلاثي:</label>
          <input type="text" id="studentName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="أدخل اسمك هنا">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1"> الفصل:</label>
          <input type="text" id="studentClass" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="مثال: أ / ب / ج">
        </div>
      </div>
    </div>

    <!-- Questions Container (Dynamic) -->
    <div id="quizQuestionsContainer" class="space-y-6">
      <!-- يتم توليد الأسئلة هنا تلقائياً حسب الإعدادات -->
    </div>

    <!-- Submit Section -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center mt-6">
      <button id="submitBtn" onclick="submitAssessment()" class="w-full md:w-1/2 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all shadow-md hover:shadow-lg">
        إرسال الإجابات ورصد النتيجة
      </button>
      <div id="submitStatus" class="mt-3 text-sm font-semibold hidden"></div>
    </div>

    <!-- Link to Admin (Optional for teacher) -->
    <!-- <div class="text-center mt-6">
      <a href="admin.html" class="text-xs text-slate-400 hover:text-slate-600 underline">⚙️ لوحة تحكم المعلم وإعدادات الأسئلة</a>
    </div> -->
  </div>

  <script>
    // جلب الإعدادات من ملف config.js أو localStorage
    const QUIZ_CONFIG = getQuizConfig();
    const SCRIPT_URL = QUIZ_CONFIG.scriptUrl;

    let pyodide = null;
    let quizResults = {}; // تخزين صحة حل كل سؤال بحسب id
    let totalPossibleScore = 0;
    let quizTimerInterval = null;

    // المؤثرات الصوتية التفاعلية عبر Web Audio API
    const AudioFeedback = {
      ctx: null,
      getCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      },
      playSuccess() {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          const now = ctx.currentTime;
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
          
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          
          osc.start(now);
          osc.stop(now + 0.35);
        } catch(e) {}
      },
      playTick() {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          const now = ctx.currentTime;
          osc.frequency.setValueAtTime(800, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          
          osc.start(now);
          osc.stop(now + 0.08);
        } catch(e) {}
      }
    };

    // تشغيل مؤقت الاختبار
    function startQuizTimer(minutes) {
      if (!minutes || minutes <= 0) return;

      const timerContainer = document.getElementById('timerContainer');
      const timerDisplay = document.getElementById('timerDisplay');
      if (!timerContainer || !timerDisplay) return;

      timerContainer.classList.remove('hidden');

      let totalSeconds = minutes * 60;

      function updateDisplay() {
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        timerDisplay.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

        if (totalSeconds <= 60) {
          timerDisplay.classList.remove('text-emerald-400');
          timerDisplay.classList.add('text-red-500', 'animate-pulse');
          // صوت نبضة خفيفة في آخر 10 ثوانٍ
          if (totalSeconds <= 10 && totalSeconds > 0) {
            AudioFeedback.playTick();
          }
        } else if (totalSeconds <= 180) {
          timerDisplay.classList.remove('text-emerald-400');
          timerDisplay.classList.add('text-amber-400');
        }

        if (totalSeconds <= 0) {
          clearInterval(quizTimerInterval);
          alert("⏱️ انتهى وقت الاختبار المخصص! سيتم إرسال إجاباتك الآن تلقائياً.");
          submitAssessment(true);
        }
        totalSeconds--;
      }

      updateDisplay();
      quizTimerInterval = setInterval(updateDisplay, 1000);
    }

    // تهيئة واجهة الاختبار من الإعدادات
    function renderQuizUI() {
      document.title = QUIZ_CONFIG.quizTitle;
      document.getElementById('gradeBadgeDisplay').innerHTML = `<span>🏷️</span> <span>${QUIZ_CONFIG.gradeBadge}</span>`;
      document.getElementById('quizTitleDisplay').innerText = QUIZ_CONFIG.quizTitle;
      document.getElementById('quizDescDisplay').innerText = QUIZ_CONFIG.quizDesc;

      const container = document.getElementById('quizQuestionsContainer');
      container.innerHTML = '';
      totalPossibleScore = 0;

      QUIZ_CONFIG.questions.forEach((q, index) => {
        quizResults[q.id] = false;
        totalPossibleScore += (Number(q.score) || 1);
        const qType = q.type || 'code';

        const card = document.createElement('div');
        card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-100";
        card.id = `card_${q.id}`;

        let bodyHTML = '';

        if (qType === 'code') {
          bodyHTML = `
            <label class="block text-xs font-semibold text-slate-500 mb-1">محرر بايثون:</label>
            <textarea id="editor_${q.id}" rows="6" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full p-3 bg-slate-900 text-emerald-400 rounded-lg text-base md:text-lg border-0 focus:ring-2 focus:ring-emerald-500 font-mono" placeholder="${q.placeholder || '# اكتب الكود هنا'}"></textarea>

            <div class="flex items-center justify-between mt-3">
              <button type="button" onclick="testPythonCode('${q.id}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition-colors">
                ▶ تشغيل واختبار الكود
              </button>
              <span id="badge_${q.id}" class="text-xs px-2 py-1 rounded hidden font-semibold"></span>
            </div>

            <div id="outBox_${q.id}" class="mt-3 p-3 bg-slate-100 rounded-lg text-xs font-mono hidden text-left dir-ltr">
              <span class="text-slate-400 block mb-1 font-sans">المخرجات (Console Output):</span>
              <pre id="output_${q.id}" class="text-slate-800 whitespace-pre-wrap"></pre>
            </div>
          `;
        } else if (qType === 'mcq') {
          const options = q.options || [];
          const optList = options.map((opt, i) => `
            <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
              <input type="radio" name="ans_${q.id}" value="${i}" onchange="checkMCQ('${q.id}', ${i})" class="w-4 h-4 text-emerald-600 focus:ring-emerald-500">
              <span class="text-sm font-semibold text-slate-700">${opt}</span>
            </label>
          `).join('');

          bodyHTML = `
            <div class="space-y-2 mt-2">
              ${optList}
            </div>
            <div class="flex items-center justify-between mt-3">
              <span class="text-xs text-slate-400">اختر إجابة واحدة</span>
              <span id="badge_${q.id}" class="text-xs px-2.5 py-1 rounded hidden font-semibold"></span>
            </div>
          `;
        } else if (qType === 'reorder') {
          // خلط العناصر بشكل عشوائي للترتيب
          const shuffled = (q.items || []).map((text, originalIndex) => ({ text, originalIndex }));
          // بعثرة العناصر مع التأكد من عدم بقائها كما هي إذا أمكن
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }

          bodyHTML = `
            <p class="text-xs text-indigo-600 mb-2 font-medium">استخدم أزرار الأسهم (⬆ ⬇) لترتيب الخطوات بالتسلسل الصحيح من الأعلى إلى الأسفل:</p>
            <div id="reorder_list_${q.id}" class="space-y-2" data-qid="${q.id}">
              ${shuffled.map((item, idx) => `
                <div class="reorder-item flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-xl" data-original="${item.originalIndex}">
                  <div class="flex items-center gap-2">
                    <span class="step-num text-xs font-bold w-6 h-6 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center">${idx + 1}</span>
                    <span class="text-sm font-semibold text-slate-800">${item.text}</span>
                  </div>
                  <div class="flex items-center gap-1">
                    <button type="button" onclick="moveReorderItem('${q.id}', this, -1)" class="w-7 h-7 bg-white hover:bg-slate-200 text-slate-700 border border-slate-300 rounded flex items-center justify-center text-xs font-bold transition">⬆</button>
                    <button type="button" onclick="moveReorderItem('${q.id}', this, 1)" class="w-7 h-7 bg-white hover:bg-slate-200 text-slate-700 border border-slate-300 rounded flex items-center justify-center text-xs font-bold transition">⬇</button>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="flex items-center justify-between mt-3">
              <button type="button" onclick="checkReorder('${q.id}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition">
                ✔ تحقق من الترتيب
              </button>
              <span id="badge_${q.id}" class="text-xs px-2.5 py-1 rounded hidden font-semibold"></span>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-bold text-slate-800">${q.title}</h2>
            <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md font-semibold">${q.score} ${q.score > 2 ? 'درجات' : (q.score === 2 ? 'درجتان' : 'درجة واحدة')}</span>
          </div>
          <p class="text-base md:text-lg text-slate-700 mb-3 leading-relaxed">
            ${q.description}
          </p>
          ${bodyHTML}
        `;
        container.appendChild(card);
      });

      // تطبيق حماية مكافحة الغش
      setupAntiCheat();
    }

    // فحص إجابة سؤال الاختيار من متعدد
    function checkMCQ(qId, selectedIdx) {
      const q = QUIZ_CONFIG.questions.find(item => item.id === qId);
      if (!q) return;

      const badge = document.getElementById(`badge_${qId}`);
      badge.classList.remove('hidden');

      const isCorrect = (Number(selectedIdx) === Number(q.correctAnswer));
      quizResults[qId] = isCorrect;

      if (isCorrect) {
        badge.className = "text-xs px-2.5 py-1 rounded bg-emerald-100 text-emerald-800 font-semibold";
        badge.innerText = "إجابة صحيحة ✔";
        AudioFeedback.playSuccess();
      } else {
        badge.className = "text-xs px-2.5 py-1 rounded bg-red-100 text-red-700 font-semibold";
        badge.innerText = "إجابة غير صحيحة ✖";
      }
    }

    // تحريك عنصر ترتيب لأعلى أو لأسفل
    function moveReorderItem(qId, btn, direction) {
      const itemRow = btn.closest('.reorder-item');
      const list = document.getElementById(`reorder_list_${qId}`);
      if (!itemRow || !list) return;

      if (direction === -1 && itemRow.previousElementSibling) {
        list.insertBefore(itemRow, itemRow.previousElementSibling);
      } else if (direction === 1 && itemRow.nextElementSibling) {
        list.insertBefore(itemRow.nextElementSibling, itemRow);
      }

      // تحديث ترقيم الخطوات
      const items = list.querySelectorAll('.reorder-item');
      items.forEach((row, i) => {
        const numSpan = row.querySelector('.step-num');
        if (numSpan) numSpan.innerText = i + 1;
      });

      // إخفاء الشارة السابقة ليعيد الطالب الفحص
      const badge = document.getElementById(`badge_${qId}`);
      if (badge) badge.classList.add('hidden');
      quizResults[qId] = false;
    }

    // فحص ترتيب الخطوات
    function checkReorder(qId) {
      const q = QUIZ_CONFIG.questions.find(item => item.id === qId);
      const list = document.getElementById(`reorder_list_${qId}`);
      const badge = document.getElementById(`badge_${qId}`);
      if (!q || !list || !badge) return;

      const items = Array.from(list.querySelectorAll('.reorder-item'));
      let isCorrect = true;

      items.forEach((row, index) => {
        const originalIndex = Number(row.getAttribute('data-original'));
        if (originalIndex !== index) {
          isCorrect = false;
        }
      });

      badge.classList.remove('hidden');
      quizResults[qId] = isCorrect;

      if (isCorrect) {
        badge.className = "text-xs px-2.5 py-1 rounded bg-emerald-100 text-emerald-800 font-semibold";
        badge.innerText = "الترتيب صحيح تماماً ✔";
        AudioFeedback.playSuccess();
      } else {
        badge.className = "text-xs px-2.5 py-1 rounded bg-amber-100 text-amber-800 font-semibold";
        badge.innerText = "الترتيب غير دقيق، حاول مجدداً ✖";
      }
    }

    // تحميل بيئة Pyodide في الخلفية
    async function initPyodide() {
      try {
        pyodide = await loadPyodide();
        console.log("Python engine loaded successfully.");
      } catch (err) {
        console.error("Failed to load Pyodide", err);
      }
    }
    initPyodide();

    // دالة اختبار الكود المحلي
    async function testPythonCode(qId) {
      if (!pyodide) {
        alert("محرك بايثون قيد التحميل حالياً، يرجى الانتظار بضع ثوانٍ...");
        return;
      }

      const q = QUIZ_CONFIG.questions.find(item => item.id === qId);
      if (!q) return;

      const codeInput = document.getElementById(`editor_${qId}`).value;
      const outBox = document.getElementById(`outBox_${qId}`);
      const outElem = document.getElementById(`output_${qId}`);
      const badge = document.getElementById(`badge_${qId}`);

      outBox.classList.remove('hidden');
      badge.classList.remove('hidden');

      if (!codeInput.trim()) {
        outElem.innerText = "تنبيه: المحرر فارغ.";
        badge.className = "text-xs px-2 py-1 rounded bg-amber-100 text-amber-800";
        badge.innerText = "لم يتم إدخال كود";
        quizResults[qId] = false;
        return;
      }

      // التحقق من الكلمة الإلزامية إن وجدت
      if (q.requiredKeyword && q.requiredKeyword.trim()) {
        const keyword = q.requiredKeyword.trim().toLowerCase();
        if (!codeInput.toLowerCase().includes(keyword)) {
          outElem.innerText = `تنبيه: يجب استخدام الكلمة المفتاحية (${keyword}) في هذا السؤال.`;
          badge.className = "text-xs px-2 py-1 rounded bg-red-100 text-red-700";
          badge.innerText = `الكلمة (${keyword}) مفقودة`;
          quizResults[qId] = false;
          return;
        }
      }

      // تحويل مخرجات print ودعم مدخلات input() التلقائية
      try {
        const mockInputsRaw = (q.mockInputs !== undefined && q.mockInputs !== null) ? String(q.mockInputs) : "";
        const mockInputsList = mockInputsRaw.split(/\r?\n/).map(s => s.trimEnd());
        
        pyodide.globals.set("_js_mock_inputs", mockInputsList);

        await pyodide.runPythonAsync(`
import sys
import io
import builtins

sys.stdout = io.StringIO()

_inputs_queue = list(_js_mock_inputs)

def _custom_mock_input(prompt=""):
    if prompt:
        sys.stdout.write(str(prompt))
    if len(_inputs_queue) > 0:
        return _inputs_queue.pop(0)
    return ""

builtins.input = _custom_mock_input
        `);

        // تشغيل كود الطالب
        await pyodide.runPythonAsync(codeInput);

        const stdout = await pyodide.runPythonAsync("sys.stdout.getvalue()");
        outElem.innerText = stdout.trim() || "[الكود تم تنفيذه بنجاح لكن دون أي مخرجات مطبوعة]";

        // التحقق من المخرجات المتوقعة
        let isCorrect = true;
        if (q.expectedOutput && q.expectedOutput.trim()) {
          const actualTokens = stdout.trim().split(/\s+/).filter(Boolean);
          const expectedTokens = q.expectedOutput.trim().split(/\s+/).filter(Boolean);

          if (actualTokens.length !== expectedTokens.length) {
            isCorrect = false;
          } else {
            for (let i = 0; i < actualTokens.length; i++) {
              if (actualTokens[i] !== expectedTokens[i]) {
                isCorrect = false;
                break;
              }
            }
          }
        }

        if (isCorrect) {
          badge.className = "text-xs px-2 py-1 rounded bg-emerald-100 text-emerald-800";
          badge.innerText = "المخرجات صحيحة تماماً ✔";
          quizResults[qId] = true;
          AudioFeedback.playSuccess();
        } else {
          badge.className = "text-xs px-2 py-1 rounded bg-amber-100 text-amber-800";
          badge.innerText = "المخرجات لا تطابق المطلوب ✖";
          quizResults[qId] = false;
        }

      } catch (err) {
        outElem.innerText = "Syntax / Runtime Error:\n" + err.message;
        badge.className = "text-xs px-2 py-1 rounded bg-red-100 text-red-700";
        badge.innerText = "خطأ في الكود ✖";
        quizResults[qId] = false;
      }
    }

    // التحقق من سجل محاولات الطالب
    function getSubmissionStorageKey() {
      const cleanTitle = (QUIZ_CONFIG.quizTitle || 'default').replace(/[\s\/\\:*?"<>|]/g, '_');
      return `quiz_submissions_${cleanTitle}`;
    }

    function checkSubmissionLimits() {
      const maxAllowed = (QUIZ_CONFIG.maxSubmissions !== undefined) ? Number(QUIZ_CONFIG.maxSubmissions) : 1;
      if (maxAllowed === 0) return; // محاولات غير محدودة

      const count = Number(localStorage.getItem(getSubmissionStorageKey()) || 0);
      if (count >= maxAllowed) {
        // حظر الإرسال وإظهار رسالة إغلاق
        const submitBtn = document.getElementById('submitBtn');
        const status = document.getElementById('submitStatus');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.className = "w-full md:w-1/2 py-3 bg-slate-300 text-slate-500 font-bold rounded-xl cursor-not-allowed shadow-none";
          submitBtn.innerText = "تم استنفاذ المحاولات المسموحة لهذا الاختبار";
        }
        if (status) {
          status.classList.remove('hidden');
          status.className = "mt-3 text-sm font-bold text-amber-700 bg-amber-50 p-3 rounded-xl border border-amber-200";
          status.innerHTML = `⚠️ لقد قمت بإرسال إجابات هذا الاختبار مسبقاً (${count} من ${maxAllowed} محاولة). تم رصد درجتك لدى المعلم.`;
        }
        // تعطيل المؤقت إن كان يعمل
        if (quizTimerInterval) clearInterval(quizTimerInterval);
        const timerContainer = document.getElementById('timerContainer');
        if (timerContainer) timerContainer.classList.add('hidden');
      }
    }

    // إرسال البيانات إلى Google Sheets
    async function submitAssessment(isAutoSubmit = false) {
      const nameInput = document.getElementById('studentName');
      const classInput = document.getElementById('studentClass');
      let name = nameInput.value.trim();
      let sClass = classInput.value.trim();
      const status = document.getElementById('submitStatus');
      const btn = document.getElementById('submitBtn');

      // إعادة ضبط الحدود
      nameInput.classList.remove('border-red-500', 'ring-2', 'ring-red-400');
      classInput.classList.remove('border-red-500', 'ring-2', 'ring-red-400');

      if (!name) {
        if (isAutoSubmit) {
          name = "طالب (انتهى الوقت ولم يدخل اسمه)";
        } else {
          alert("يرجى كتابة اسم الطالب أولاً.");
          nameInput.classList.add('border-red-500', 'ring-2', 'ring-red-400');
          nameInput.focus();
          nameInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
      }

      if (!sClass) {
        if (isAutoSubmit) {
          sClass = "-";
        } else {
          alert("يرجى إدخال الفصل.");
          classInput.classList.add('border-red-500', 'ring-2', 'ring-red-400');
          classInput.focus();
          classInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
      }

      if (quizTimerInterval) {
        clearInterval(quizTimerInterval);
      }

      btn.disabled = true;
      btn.innerText = "جاري الإرسال...";
      status.classList.remove('hidden');
      status.className = "mt-3 text-sm font-semibold text-blue-600";
      status.innerText = "يتم الآن إرسال بياناتك إلى المعلم...";

      let totalEarnedScore = 0;
      const payload = {
        studentName: name,
        studentClass: sClass,
        quizTitle: QUIZ_CONFIG.quizTitle || 'اختبار بدون عنوان',
        timestamp: new Date().toISOString()
      };

      // جمع إجابات كل الأسئلة
      QUIZ_CONFIG.questions.forEach((q, index) => {
        const num = index + 1;
        const qType = q.type || 'code';
        let answerText = '';
        let isValid = !!quizResults[q.id];

        if (qType === 'code') {
          answerText = (document.getElementById(`editor_${q.id}`) || {}).value || '';
        } else if (qType === 'mcq') {
          const selectedRadio = document.querySelector(`input[name="ans_${q.id}"]:checked`);
          if (selectedRadio) {
            const optIdx = Number(selectedRadio.value);
            answerText = (q.options && q.options[optIdx]) ? q.options[optIdx] : `الخيار ${optIdx + 1}`;
            isValid = (optIdx === Number(q.correctAnswer));
          } else {
            answerText = "لم يُجب";
            isValid = false;
          }
        } else if (qType === 'reorder') {
          const list = document.getElementById(`reorder_list_${q.id}`);
          if (list) {
            const items = Array.from(list.querySelectorAll('.reorder-item'));
            let allCorrect = true;
            const userOrderTexts = [];
            items.forEach((row, rIdx) => {
              const orig = Number(row.getAttribute('data-original'));
              if (orig !== rIdx) allCorrect = false;
              const textElem = row.querySelector('.text-sm');
              userOrderTexts.push(`${rIdx + 1}. ` + (textElem ? textElem.innerText : ''));
            });
            answerText = userOrderTexts.join(' -> ');
            isValid = allCorrect;
          }
        }

        quizResults[q.id] = isValid;
        payload[`q_${num}_code`] = answerText;
        payload[`q_${num}_answer`] = answerText;
        payload[`q_${num}_valid`] = isValid;
        payload[`q_${num}_title`] = q.title;

        // دعم للتوافقية القديمة في حال كان السكربت السابق يستقبل forCode و whileCode
        if (index === 0) {
          payload.forCode = answerText;
          payload.forSuccess = isValid;
        } else if (index === 1) {
          payload.whileCode = answerText;
          payload.whileSuccess = isValid;
        }

        if (isValid) {
          totalEarnedScore += (Number(q.score) || 1);
        }
      });

      payload.totalScore = totalEarnedScore;
      payload.totalPossible = totalPossibleScore;

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        status.className = "mt-3 text-sm font-semibold text-emerald-600";
        status.innerText = `تم إرسال الاختبار بنجاح! درجتك التقديرية: ${totalEarnedScore} من ${totalPossibleScore}`;
        btn.innerText = "تم الإرسال";

        // تسجيل المحاولة محلياً
        const maxAllowed = (QUIZ_CONFIG.maxSubmissions !== undefined) ? Number(QUIZ_CONFIG.maxSubmissions) : 1;
        if (maxAllowed > 0) {
          const currentCount = Number(localStorage.getItem(getSubmissionStorageKey()) || 0) + 1;
          localStorage.setItem(getSubmissionStorageKey(), currentCount);
          if (currentCount >= maxAllowed) {
            btn.disabled = true;
            btn.className = "w-full md:w-1/2 py-3 bg-slate-300 text-slate-500 font-bold rounded-xl cursor-not-allowed shadow-none";
            btn.innerText = "تم استنفاذ المحاولات المسموحة";
          }
        }
      } catch (e) {
        status.className = "mt-3 text-sm font-semibold text-red-600";
        status.innerText = "حدث خطأ أثناء الإرسال. يرجى مراجعة المعلم.";
        btn.disabled = false;
        btn.innerText = "إعادة المحاولة";
      }
    }

function showToast(message, type = 'warning') {
  let toast = document.getElementById('toastMessage');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toastMessage';
    document.body.appendChild(toast);
  }
  toast.innerText = message;
  toast.className = type === 'warning' ? 'bg-amber-600 show' : 'bg-red-600 show';
  
  clearTimeout(window._toastTimeout);
  window._toastTimeout = setTimeout(() => {
    toast.className = toast.className.replace('show', '').trim();
  }, 2500);
}

function setupAntiCheat() {
  document.querySelectorAll('textarea').forEach(el => {
    let previousValue = el.value;
    
    ['keydown', 'focus', 'click', 'touchstart'].forEach(evt => {
      el.addEventListener(evt, () => {
        previousValue = el.value;
      });
    });

    // دعم مفتاح Enter للمسافة البادئة (Indentation) ومفتاح Tab
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        const val = this.value;
        
        // معرفة السطر الحالي لحساب المسافة البادئة الموجودة مسبقاً
        const lineStart = val.lastIndexOf('\n', start - 1) + 1;
        const currentLine = val.substring(lineStart, start);
        const matchIndent = currentLine.match(/^[ ]+/);
        let baseIndent = matchIndent ? matchIndent[0] : '';
        
        // إضافة 4 مسافات فقط وفقط إذا انتهى السطر بنقطتين رأسيين (:)
        const trimmedBefore = currentLine.trimEnd();
        const extraIndent = trimmedBefore.endsWith(':') ? '    ' : '';
        const indentToInsert = '\n' + baseIndent + extraIndent;

        this.value = val.substring(0, start) + indentToInsert + val.substring(end);
        this.selectionStart = this.selectionEnd = start + indentToInsert.length;
        previousValue = this.value;
        return;
      }

      if (e.key === 'Tab') {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        const tabSpaces = '    ';
        this.value = this.value.substring(0, start) + tabSpaces + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 4;
        previousValue = this.value;
        return;
      }
    });

    el.addEventListener('beforeinput', function(e) {
      if (e.inputType === 'insertFromPaste' || e.inputType === 'insertReplacementText' || e.inputType === 'insertFromDrop') {
        e.preventDefault();
        showToast('تم حظر اللصق من الحافظة!', 'warning');
        return false;
      }
    });

    el.addEventListener('input', function(e) {
      if (e.inputType === 'insertFromPaste' || e.inputType === 'insertReplacementText') {
        this.value = previousValue;
        showToast('تم حظر اللصق من الحافظة!', 'warning');
        return;
      }
      
      const currentVal = this.value;
      const addedChars = currentVal.length - previousValue.length;
      if (addedChars > 3 && (!e.inputType || e.inputType === 'insertText')) {
        this.value = previousValue;
        showToast('تم حظر إدراج النص المنسوخ من شريط الحافظة!', 'warning');
        return;
      }
      
      previousValue = this.value;
    });
  });
}

// 1. منع القائمة المنسدلة للزر الأيمن للماوس (Right Click)
document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    showToast("تم تعطيل النقر بزر الفأرة الأيمن للحفاظ على نزاهة الاختبار", "warning");
});

// 2. منع أحداث النسخ واللصق والقص عبر الماوس أو القوائم
['copy', 'paste', 'cut'].forEach(eventType => {
    document.addEventListener(eventType, function (e) {
        e.preventDefault();
        const actionName = eventType === 'copy' ? 'النسخ' : eventType === 'paste' ? 'اللصق' : 'القص';
        showToast(`عملية ${actionName} معطلة داخل الاختبار!`, "warning");
    });
});

// 3. منع اختصارات لوحة المفاتيح الشهيرة للنسخ واللصق وفحص الصفحة
document.addEventListener('keydown', function (e) {
    const isCtrlOrMeta = e.ctrlKey || e.metaKey;
    const key = e.key.toLowerCase();

    if (isCtrlOrMeta && ['c', 'v', 'x', 'u', 's'].includes(key)) {
        e.preventDefault();
        showToast("الاختصارات معطلة داخل منصة الاختبار!", "warning");
        return false;
    }

    if (
        e.key === 'F12' || 
        (isCtrlOrMeta && e.shiftKey && ['i', 'j', 'c'].includes(key))
    ) {
        e.preventDefault();
        showToast("أدوات المطور معطلة أثناء الاختبار!", "warning");
        return false;
    }
});

// تشغيل بناء الواجهة عند تحميل الصفحة
renderQuizUI();
startQuizTimer(Number(QUIZ_CONFIG.durationMinutes) || 0);
checkSubmissionLimits();
